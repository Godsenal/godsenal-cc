# 품질 게이트 — 모든 PR·main push에서 타입체크·테스트를 강제한다.
# 시크릿은 OTA 호환 점검(정보성)의 EXPO_TOKEN 하나뿐이고, 없으면 그 잡만 조용히 건너뛴다.
# [템플릿] NODE_VERSION을 프로젝트 값으로 치환. 모노레포면 paths-ignore에 앱 무관 경로 추가.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치/PR에서 새 push가 오면 이전 실행은 취소(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: NODE_VERSION
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

  # 이 PR이 네이티브 지문(runtimeVersion)을 바꾸는지 머지 전에 알려준다. 지문이 갈리면 이후 OTA가
  # 현재 스토어 유저에게 안 내려가므로, "지금 머지할지 릴리스까지 미룰지"는 사람이 판단해야 한다.
  # 정보성 — 스크립트가 항상 exit 0이다(실패로 만들면 자동화가 되돌리려 든다).
  # 직푸시 흐름이면 이 잡은 안 돌고, eas-update.yml의 같은 점검이 게시 요약에 남는다.
  ota-compat:
    name: OTA 호환 (정보성)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: NODE_VERSION
          cache: npm

      # eas-cli는 로컬 의존성이 아니라 전역 설치다 — 이게 없으면 스크립트가 조회를 건너뛴다.
      - name: Setup EAS
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install deps
        run: npm ci

      # 토큰이 없는 레포/포크에서는 조용히 건너뛴다(게이트가 아니므로 막을 이유가 없다).
      - name: 지문 드리프트 점검
        if: env.EXPO_TOKEN != ''
        run: node scripts/check-ota-compat.mjs

  doctor:
    name: expo-doctor (정보성)
    runs-on: ubuntu-latest
    # 게이트가 아니라 헬스체크 — 실패해도 CI를 막지 않는다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: NODE_VERSION
          cache: npm

      - name: Install deps
        run: npm ci

      - name: expo-doctor
        run: npx expo-doctor
