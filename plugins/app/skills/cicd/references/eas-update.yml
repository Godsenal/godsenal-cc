# OTA(EAS Update) — main에 JS/설정 변경이 머지되면 production 채널로 즉시 반영.
# 네이티브 빌드가 필요 없는 대부분의 변경이 여기서 커버된다(빠르고 저렴).
# 전제: production 채널 ↔ main 브랜치 링크 1회 필요(eas channel:edit production --branch main).
# [템플릿] NODE_VERSION 치환. 백엔드/웹 디렉토리가 있으면 paths-ignore에 추가.
name: EAS Update (OTA)

on:
  push:
    branches: [main]
    # 문서·백엔드·CI 자체 변경은 OTA 불필요 → 건너뜀.
    paths-ignore:
      - docs/**
      - supabase/**
      - .github/**
      - '**.md'

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: publish update
    runs-on: ubuntu-latest
    # OTA는 스토어(production) 빌드에 도달해야 한다. app.config.js가 APP_VARIANT로 번들 ID·스킴을 분기하고
    # runtimeVersion=fingerprint가 그 config를 지문에 포함 → 지문이 프로덕션 빌드와 일치해야 업데이트가
    # 적용된다. eas.json env는 EAS 빌드에만 적용되므로 여기서 명시 주입. (변형 미사용 프로젝트여도 무해)
    env:
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: NODE_VERSION
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install deps
        run: npm ci

      # --auto: 브랜치=현재 git 브랜치(main), 메시지=커밋 메시지.
      - name: Publish update
        run: eas update --auto --non-interactive
