# OTA(EAS Update) — main에 JS/설정 변경이 머지되면 production 채널로 즉시 반영.
# 네이티브 빌드가 필요 없는 대부분의 변경이 여기서 커버된다(빠르고 저렴).
# 전제: production 채널 ↔ main 브랜치 링크 1회 필요(eas channel:edit production --branch main).
# [템플릿] NODE_VERSION 치환. 백엔드/웹 디렉토리가 있으면 paths-ignore에 추가.
name: EAS Update (OTA)

on:
  push:
    branches: [main]
    # 문서·백엔드·CI 자체 변경은 OTA 불필요 → 건너뜀.
    paths-ignore:
      - docs/**
      - supabase/**
      - .github/**
      - '**.md'

  # 비상구 — 네이티브 변경이 main에 들어가 지문이 갈린 뒤, 스토어 심사~유저 업데이트 구간에
  # 구 빌드 유저에게 픽스를 내려야 할 때 쓴다. 스토어에 나가 있는 커밋 기준으로 픽스를 cherry-pick한
  # 브랜치를 만들고 그 ref로 이 워크플로를 수동 실행하면, 구 지문 업데이트가 EAS 브랜치 main에
  # 하나 더 얹힌다. 클라이언트는 자기 런타임에 맞는 최신을 받으므로 두 런타임이 공존한다.
  # (로컬에서 직접 eas update 하지 말 것 — 아래 env 주입이 빠져 런타임 설정이 비는 번들이 나간다.)
  workflow_dispatch:
    inputs:
      ref:
        description: '게시할 git ref (구 런타임 백포트 브랜치/커밋). 비우면 현재 브랜치 HEAD'
        required: false
        type: string

concurrency:
  # 백포트 수동 실행(ref 입력)은 main push와 같은 그룹에 묶이면 안 된다 — 서로를 취소시킨다.
  group: eas-update-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: publish update
    runs-on: ubuntu-latest
    # OTA는 스토어(production) 빌드에 도달해야 한다. app.config.js가 APP_VARIANT로 번들 ID·스킴을 분기하고
    # runtimeVersion=fingerprint가 그 config를 지문에 포함 → 지문이 프로덕션 빌드와 일치해야 업데이트가
    # 적용된다. eas.json env는 EAS 빌드에만 적용되므로 여기서 명시 주입. (변형 미사용 프로젝트여도 무해)
    env:
      APP_VARIANT: production
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 백포트 수동 실행이면 지정한 ref를, 평소 push면 그 커밋을 그대로.
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: NODE_VERSION
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install deps
        run: npm ci

      # 게시 결과가 실제로 스토어 유저에게 닿는지 기록으로 남긴다(정보성 — 항상 exit 0).
      # 지문이 갈렸으면 여기 요약에 경고가 뜬다 = 네이티브 빌드를 밀 때가 됐다는 신호.
      - name: OTA 호환 점검
        run: node scripts/check-ota-compat.mjs

      # EAS 브랜치는 항상 main(= production 채널이 가리키는 브랜치). --auto는 git 브랜치명을 쓰는데,
      # 백포트 수동 실행은 다른 ref를 체크아웃하므로 엉뚱한 EAS 브랜치로 나갈 수 있다 → 명시한다.
      - name: Publish update
        env:
          UPDATE_MESSAGE: ${{ inputs.ref && format('backport {0}', inputs.ref) || github.event.head_commit.message }}
        run: |
          MSG=$(printf '%s' "$UPDATE_MESSAGE" | head -n 1)
          eas update --branch main --message "$MSG" --non-interactive
