# Supabase 배포 — main의 supabase/** 변경 시 마이그레이션·Edge Function을 원격에 반영.
# PR에서는 시크릿 없이 db lint(정적 문법 검사)만 돈다.
# [템플릿] SUPABASE_PROJECT_REF 치환(레포 variable SUPABASE_PROJECT_ID 권장, 없으면 fallback으로 사용).
#          EDGE_FUNCTION_NAME 치환 — Edge Function이 없으면 해당 step 삭제.
name: Supabase Deploy

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/functions/**
      - supabase/config.toml
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
  # 수동 실행 — 워크플로 자체가 고장났다 고쳐진 경우 등, supabase/** 변경 없이 재배포할 때.
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR: 마이그레이션 SQL 정적 검사(시크릿 불필요).
  lint:
    name: db lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lint migrations
        run: supabase db lint --level warning

  # main push: 대기 중 마이그레이션 적용 + 함수 배포.
  deploy:
    name: db push + functions deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # 프로젝트 ref: 레포 variable가 있으면 그걸, 없으면 하드코딩 fallback.
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'SUPABASE_PROJECT_REF' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      # 원격에 없는 마이그레이션만 순서대로 적용.
      - name: Push migrations
        run: supabase db push

      # Edge Function이 없으면 이 step 삭제. 여러 개면 반복.
      - name: Deploy edge function
        run: supabase functions deploy EDGE_FUNCTION_NAME --project-ref "$PROJECT_ID"
