<template>
<style>

<div id="slide" data-composition-id="slide" data-width="1080" data-height="1440">

{{PANEL}}

    <script>
      const SLIDE = {{DATA}};
      const tl = gsap.timeline({ paused: true });
      // 카운트업 중간값 표시: 소수 자리·천 단위 쉼표·앞뒤 단위. 끝값은 빌드할 때 만든 text 를 그대로 쓴다
      const fmt = (n) => {
        const [i, d] = n.toFixed(SLIDE.decimals).split(".");
        const s = SLIDE.thousands ? i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") : i;
        return SLIDE.prefix + s + (d ? "." + d : "") + SLIDE.suffix;
      };
      const countUp = (el, it, t0, dur) => {
        const c = { n: 0 };
        tl.fromTo(c, { n: 0 }, {
          n: it.value, duration: dur, ease: "power3.out",
          onUpdate() { el.textContent = this.progress() >= 1 ? it.text : fmt(c.n); },
        }, t0);
      };
{{TYPE_SCRIPT}}
      tl.to({}, { duration: 0.01 }, SLIDE.duration - 0.01);
      window.__timelines["slide"] = tl;
