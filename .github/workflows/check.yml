name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repo checks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check.py --base "origin/${{ github.base_ref }}"
          else
            python3 scripts/check.py
          fi
      - name: Runner tests
        run: python3 -m unittest discover -s scripts
